name: Claims intelligence checks
on:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.pipeline --claims 5000 --db data/ci.duckdb --output data/ci-snapshot
      - run: python -m scripts.verify_snapshot data/ci-snapshot
      - run: bash scripts/streamlit_smoke.sh
